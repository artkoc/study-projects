# 🔵 Blue    = config.yaml     → User-defined inputs (raw config)
# 🟢 Green   = locals.tf       → Decodes YAML and makes values usable in Terraform
# 🔴 Red     = providers.tf    → Initializes the Azure provider
# 🟡 Yellow  = platform.tf     → Creates resources using values from locals

global:
  location: SwedenCentral                # 🟢 Used in locals.tf → local.config.global.location → 🟡 Resource location
  subscription:
    id: 13bebc20-5b21-4ab2-94c5-a2d2d084fd75  # 🟢 Used in locals.tf → local.subscription_id → 🔴 provider

landing_zones:
  platform:
    id: PLATFORM                         # 🟡 Used in platform.tf to construct RG name and check if log analytics is enabled
    sequence_no: 1                       # 🟡 Used in platform.tf → naming pattern
    virtual network:                     # (Empty, may be used in future expansion)
    log_analytics: true                  # 🟡 Used in conditional `count` logic to create log analytics resource
  app_alpha:
    id: APP-ALPHA                        # 🟡 Used in RG naming
    sequence_no: 1
  app_beta:
    id: APP-BETA
    sequence_no: 2
